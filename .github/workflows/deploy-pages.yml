name: Deploy static site to GitHub Pages

# Builds the site without the Express API (catalogue bundled, forms open the
# visitor's mail app) and publishes `dist/` to Pages. Works for both a project
# site (https://<user>.github.io/<repo>/) and a user site (https://<user>.github.io/)
# because the base path is derived from the repository name.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Work out the Pages base path
        id: base
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${owner}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build:static -- --base="${{ steps.base.outputs.base }}"

      # Pages serves 404.html for any unknown path; handing it the SPA shell lets
      # React Router resolve deep links such as /properties/<slug>.
      - name: SPA fallback for deep links
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
