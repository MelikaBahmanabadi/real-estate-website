# Horizon Properties — sandbox development environment.
#
# One container runs the Vite dev server (host port 3000) plus the Express API
# (port 8000, proxied by Vite at /api). Single origin keeps sessions/cookies and
# the preview proxy simple, and both processes reload from the bind-mounted
# source, so edits appear without rebuilding an image.

services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    # Dependencies live in a named volume so the sandbox host stays clean; they
    # are installed from the committed lockfile on every start, so a lockfile
    # change is picked up without rebuilding an image.
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev:all
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - API_PROXY_TARGET=http://127.0.0.1:8000
      # Supplied by the platform; the flag is only ever compared to "1".
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      # Probes the Vite frontend AND the API, naming whichever is failing.
      test:
        - CMD-SHELL
        - >-
          node -e "const t=[['web','http://127.0.0.1:3000/'],['api','http://127.0.0.1:8000/api/health']];
          Promise.all(t.map(([n,u])=>fetch(u).then(r=>r.ok?null:n+' HTTP '+r.status).catch(()=>n+' unreachable')))
          .then(es=>{const f=es.filter(Boolean);if(f.length){console.error('FAILED: '+f.join(', '));process.exit(1)}})"
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 150s
    restart: on-failure
    labels:
      base44.project: Horizon Properties
      base44.kind: web
      base44.port: '3000'

volumes:
  node_modules:
